<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NovaTunes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2 class="logo">NovaTunes</h2>
      <nav>
        <ul>
          <li><img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Home Icon"> Home</li>
          <li><img src="https://cdn-icons-png.freepik.com/256/16175/16175749.png" alt="Search Icon"> Search</li>
          <li><img src="https://static.thenounproject.com/png/2942307-200.png" alt="Library Icon"> Your Library</li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-view">
      <header class="top-bar">
        <div class="search-bar">
          <img src="https://static.vecteezy.com/system/resources/thumbnails/009/652/218/small_2x/magnifying-glass-icon-isolated-on-white-background-search-illustration-vector.jpg" alt="Search">
          <input id="searchInput" type="text" placeholder="Search for songs, artists..." />
        </div>
      </header>

      <section class="content">
        <h3>Featured</h3>
        <div class="card-grid" id="featured-section"></div>

        <h3>Artists</h3>
        <div class="card-grid" id="artists-section"></div>

        <h3>Playlist</h3>
        <div id="playlist"></div> 
      </section>
    </main>

    <!-- Music Player Footer -->
    <footer class="player">
      <div class="song-info">
        <img src="images/cover.jpg" alt="cover" class="cover">
        <div>
          <h4 id="title">Song Title</h4>
          <p id="artist">Artist Name</p>
        </div>
      </div>

      <div class="controls">
        <button id="prev">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRKz9BmJrvLJCsm_NHf9ZqZSApGpKZW6fipw&s" alt="Previous">
        </button>
        <button id="togglePlayPause">
          <img id="playPauseIcon" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSjIWN9Wh2Nr651IvNzeAOFMfy3BR0pQUfncg&s" alt="Play">
        </button>
        <button id="next">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiS1gl84F73zaW9MNYE_r-Ac66QqaJBH7McA&s" alt="Next">
        </button>
      </div>

      <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" id="progress" value="0" max="100" />
        <span id="duration">0:00</span>
      </div>

      <div class="volume-bar">
        <img src="https://cdn-icons-png.flaticon.com/512/483/483365.png" alt="Volume">
        <input type="range" id="volume" min="0" max="1" step="0.1" value="1" />
      </div>
    </footer>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
